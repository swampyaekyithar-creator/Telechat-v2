name: Build Telechat APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install Capacitor & Configure Android
        run: |
          npm install
          npx cap add android
          cp google-services.json android/app/google-services.json
          cp debug.keystore android/app/debug.keystore
          printf '\next {\n  rgcfaIncludeGoogle = true\n  androidxCredentialsVersion = "1.3.0"\n}\n' >> android/variables.gradle
          python3 -c "p='android/app/build.gradle'; s=open(p).read(); s=s.replace('buildTypes {', \"signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }\\n    buildTypes {\"); s=s.replace('release {', 'debug { signingConfig signingConfigs.debug }\\n        release {'); open(p,'w').write(s)"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' android/app/src/main/AndroidManifest.xml

      - name: Patch MainActivity for WebView Mic & Camera Permissions
        run: |
          cat << 'EOF' > android/app/src/main/java/com/telechat/app/MainActivity.java
          package com.telechat.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_MEDIA_PERMS = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestMediaPermissionsIfNeeded();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }

              private void requestMediaPermissionsIfNeeded() {
                  String[] perms = new String[] {
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA
                  };
                  boolean need = false;
                  for (String p : perms) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          need = true;
                          break;
                      }
                  }
                  if (need) {
                      ActivityCompat.requestPermissions(this, perms, REQ_MEDIA_PERMS);
                  }
              }
          }
          EOF
          npx cap sync android

      - name: Compile Debug APK & Verify SHA-1
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1:|SHA256:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telechat-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
